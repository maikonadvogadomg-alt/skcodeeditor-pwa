name: Build APK Android (TWA)

on:
  workflow_dispatch:
    inputs:
      pages_url:
        description: "URL do GitHub Pages (vazio = calcular automaticamente)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools" 2>/dev/null || true

      - name: Calcular URL
        id: url
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          INPUT="${{ github.event.inputs.pages_url }}"
          if [ -n "$INPUT" ]; then URL="$INPUT"; else URL="https://${OWNER}.github.io/${REPO}/"; fi
          HOST=$(echo "$URL" | sed 's|https://||;s|/.*||')
          PKG="com.$(echo $OWNER | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g').$(echo $REPO | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')"
          echo "pages_url=$URL"  >> $GITHUB_OUTPUT
          echo "host=$HOST"      >> $GITHUB_OUTPUT
          echo "pkg=$PKG"        >> $GITHUB_OUTPUT
          echo "URL=$URL HOST=$HOST PKG=$PKG"

      - name: Criar projeto Android
        run: |
          URL="${{ steps.url.outputs.pages_url }}"
          HOST="${{ steps.url.outputs.host }}"
          PKG="${{ steps.url.outputs.pkg }}"
          mkdir -p twa-app/app/src/main/res/values twa-app/gradle/wrapper

          printf 'rootProject.name = "SKCodeEditor"\ninclude ":app"\n' > twa-app/settings.gradle

          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m\n' > twa-app/gradle.properties

          cat > twa-app/build.gradle << 'EOFILE'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.2.2" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOFILE

          cat > twa-app/app/build.gradle << EOFILE
          plugins { id "com.android.application" }
          android {
              compileSdk 34
              namespace "$PKG"
              defaultConfig {
                  applicationId "$PKG"
                  minSdk 21; targetSdk 34
                  versionCode 1; versionName "1.0"
              }
              buildTypes { debug { debuggable true } }
          }
          dependencies {
              implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
          }
          EOFILE

          cat > twa-app/app/src/main/AndroidManifest.xml << EOFILE
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="SK Code Editor" android:allowBackup="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name="com.google.androidbrowserhelper.trusted.LauncherActivity" android:exported="true">
                      <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="$URL" />
                      <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR" android:resource="@color/colorPrimary" />
                      <meta-data android:name="android.support.customtabs.trusted.FALLBACK_STRATEGY" android:value="customtabs" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="https" android:host="$HOST"/>
                      </intent-filter>
                  </activity>
                  <service android:name="com.google.androidbrowserhelper.trusted.DelegationService"
                      android:exported="true"
                      android:permission="android.permission.BIND_CUSTOM_TABS_CONNECTION">
                      <intent-filter>
                          <action android:name="android.support.customtabs.trusted.TRUSTED_WEB_ACTIVITY_SERVICE"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOFILE

          printf '<?xml version="1.0"?>\n<resources><string name="app_name">SK Code Editor</string></resources>\n' > twa-app/app/src/main/res/values/strings.xml
          printf '<?xml version="1.0"?>\n<resources><color name="colorPrimary">#0d1117</color></resources>\n' > twa-app/app/src/main/res/values/colors.xml

          cat > twa-app/gradle/wrapper/gradle-wrapper.properties << 'EOFILE'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOFILE

          find twa-app -type f | sort

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        working-directory: twa-app
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Localizar APK
        run: |
          APK=$(find twa-app -name "*.apk" -type f | head -1)
          [ -z "$APK" ] && { echo "APK nao encontrado!"; exit 1; }
          echo "APK: $APK ($(du -sh $APK | cut -f1))"
          echo "apk_path=$APK" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SK-Code-Editor-APK
          path: ${{ env.apk_path }}
          retention-days: 30

      - name: Salvar APK em releases/
        run: |
          mkdir -p releases
          cp "${{ env.apk_path }}" releases/sk-code-editor.apk
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add releases/sk-code-editor.apk
          git commit -m "APK $(date +%Y-%m-%d)" || true
          git push || true
