name: Deploy no GitHub Pages

  on:
    push:
      branches: [main, master]
    workflow_dispatch:

  permissions:
    contents: write

  jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Deploy dist-pronto para gh-pages
          uses: peaceiris/actions-gh-pages@v3
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./dist-pronto
            force_orphan: true
            enable_jekyll: false
  